function generateVendorPackImpl(){
 const ids=[...S.selectedIssues];
 if(ids.length===0){toast("Select at least one issue.");return}
 const excluded=ids.map(byId).filter(exportExcluded);
 if(excluded.length && !confirm("Some selected issues are normally excluded from vendor export. Include them anyway?"))return;
 const incEl=document.getElementById("incEvidence");
 const incEvidence=incEl?incEl.checked:true;
 const date=new Date().toISOString().slice(0,10);
 const filename="Northstar_UAT_Vendor_Issue_Pack_"+date+".csv";
 const headers=["Issue ID","Call ID","Issue Title","Issue Description","Expected Behaviour","Actual Behaviour","Severity","Category","Transcript Evidence / Line References","Post-call Evidence","Reported By","Assigned Owner","Vendor Status","Current Issue State","Retest Status","Retest Notes","Vendor Response","Build Version"];
 const rows=ids.map(function(id){
  const i=byId(id);
  const ev=incEvidence?(i.evidenceLines&&i.evidenceLines.length?i.evidenceLines.join("; "):(i.call?"Not supplied":"Original transcript not supplied")):"Not supplied";
  return [i.id,i.call||"Not supplied",i.title,"Not supplied",i.expected||"Not supplied",i.actual||"Not supplied",sev(i)||"Not supplied",i.category||"Not supplied",ev,"Not supplied",i.reporter||"Not supplied",i.owner||"Not supplied",i.sheet||"Not supplied",i.state,rtStatusOf(i),rtNotesOf(i),vendorResponseText(i),buildVersionOf(i)];
 });
 const csv=headers.map(csvEscape).join(",")+"\n"+rows.map(function(r){return r.map(csvEscape).join(",")}).join("\n");
 const blob=new Blob([csv],{type:"text/csv"});
 const url=URL.createObjectURL(blob);
 const handoffId="HO-"+String(S.handoffs.length+1).padStart(3,"0");
 const preparedAt=now();
 S.handoffs.push({id:handoffId,exportedIds:ids,recipient:"Karthik",exportedAt:preparedAt,filename:filename,status:"Prepared",sentAt:null,sentBy:null});
 const email="Subject: Northstar Life - UAT Issues for Resolution\n\nHi Karthik,\n\nPlease find attached the latest Northstar Life UAT issue report.\n\nThe report contains the issues reviewed by our team that require vendor investigation and resolution.\n\nSelected issues ("+ids.length+"): "+ids.join(", ")+".\n\nPlease review each issue and share:\n\n- Root cause, where identified.\n- Resolution status.\n- Fixed build/version details.\n- Any issues that require additional information from our team.\n\nOnce the updated build is available, we will coordinate retesting and share the results.\n\nPlease ensure that each issue is addressed individually so we can track its resolution.\n\nRegards,\nPriya Nair\nUAT Coordinator\nNorthstar Life";
 S.exportState={ids:ids,filename:filename,csvUrl:url,email:email,handoffId:handoffId,preparedAt:preparedAt};
 const bodyHtml="<div class=\"flag ok\">Vendor issue pack generated successfully.</div><p class=\"muted\" style=\"margin-bottom:10px\">"+ids.length+" issue(s) exported: "+ids.join(", ")+"</p><div class=\"kv\"><span>File</span><b>"+filename+"</b></div><div class=\"kv\"><span>Handoff ID</span><b>"+handoffId+"</b></div><div class=\"kv\"><span>Status</span><b>Prepared</b></div><div style=\"margin-top:12px;display:grid;gap:8px\"><button class=\"btn primary\" onclick=\"downloadExportCsv()\">Download Issue Report (CSV)</button><button class=\"btn\" onclick=\"downloadEmailDraft()\">Download Email Draft</button><button class=\"btn\" onclick=\"copyEmailDraft()\">Copy Email</button><button class=\"btn danger\" data-act=\"markSent\">Mark as Sent</button></div><p class=\"muted\" style=\"margin-top:10px;font-size:12px\">Priya must attach the CSV manually when sending the email. Mark as Sent only after the email is actually sent.</p>";
 modal("Vendor Pack Generated",bodyHtml,"<button class=\"btn\" data-act=\"closeModal\">Close</button>");
}

function downloadEmailDraft(){if(!S.exportState)return;const blob=new Blob([S.exportState.email],{type:"text/plain"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Northstar_UAT_Vendor_Email_Draft_"+new Date().toISOString().slice(0,10)+".txt";a.click();URL.revokeObjectURL(url);toast("Email draft downloaded.")}
