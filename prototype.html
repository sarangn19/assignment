  modal("Go / No-go decision",`<div class="flag">${canon().filter(i=>isOpen(i)&&isHigh(i)).length} open blocker(s) and ${canon().filter(i=>i.state==="Retest required").length} retest(s) awaiting verification.</div><div class="form"><label>Decision<select id="dv"><option>Go</option><option>Conditional go</option><option>No-go</option></select></label><label class="full">Rationale, including accepted risks *<textarea id="dw"></textarea></label></div><div class="err" id="merr"></div>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveDec">Record decision</button>`)},

 closeModal(){closeModal()}
};
function now(){return new Date().toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function setTriage(id,v){if(!need(isPriya(),"Priya Nair")){render();return}const i=byId(id);i.triage=v;log(i,"Priya Nair","Triage severity set to "+(v||"Not set")+".");if(v&&i.missing.includes("Severity")){i.missing=i.missing.filter(m=>m!=="Severity")}fixNeeds(i);render()}
function setCall(id,v){const i=byId(id);if(!v)return;i.call=v;log(i,S.actor,"Call ID added: "+v+".");i.missing=i.missing.filter(m=>m!=="Call ID");fixNeeds(i);render()}
function setOwner(id,v){if(!need(isPriya(),"Priya Nair")){render();return}const i=byId(id);i.owner=v;log(i,"Priya Nair","Owner set to "+(v||"Unassigned")+".");render()}
function assign(id,v){if(!need(isPriya(),"Priya Nair")){render();return}const i=byId(id);i.assign=v;log(i,"Priya Nair","Retest assigned to "+(v||"nobody")+".");s05()}
function fixNeeds(i){if(!i.missing.length&&i.state==="Needs information"){i.state="Open";log(i,"Tool","All missing information supplied. State set to Open.")}}
/* ===== Report issue ===== */
const CATS=["Date accuracy","Payment handling","Voice quality","Conversation flow","Callback","Customer preference","Disclosure / Compliance","Other"];
function reportModal(call,pre){
 if(!need(isTester(),"a tester or Priya"))return;
 const lines=pre?pre.lines:S.sel;
 modal("Report an issue",`<div class="form"><label>Linked Call ID<select id="rc" onchange="similar()"><option value="">Select Call ID…</option>${[...Object.keys(CALLS),...SHEET_ONLY].map(c=>`<option ${c===call?"selected":""}>${c}</option>`).join("")}</select></label>
 <label>Category<select id="rg" onchange="similar()">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></label>
 <label class="full">Evidence lines<input id="rl" value="${esc(lines.join(", "))}" placeholder="Select lines in the transcript first (optional)"></label>
 <label class="full">Title *<input id="rt" value="${esc(pre?pre.title:"")}"></label>
 <label class="full">Expected<textarea id="rx"></textarea></label><label class="full">Actual *<textarea id="ra2">${esc(pre?pre.actual:"")}</textarea></label>
 <label>Severity (suggested)<select id="rv2"><option value="">Not set</option>${["Critical","High","Medium","Low"].map(s=>`<option>${s}</option>`).join("")}</select></label>
 <label>Reporter<input value="${esc(S.actor)}" disabled></label>
 <label class="full">Similar existing issues<select id="rd"><option value="">Create as a new issue</option></select></label></div>
 <div class="flag" style="margin-top:10px">Missing a Call ID or severity? You can still save. The report is kept as Needs information.</div><div class="err" id="merr"></div>`,
 `<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" onclick="saveIssue()">Save report</button>`);similar()}
function similar(){const c=$("#rc").value,g=$("#rg").value,s=canon().filter(i=>i.category===g||(c&&i.call===c));$("#rd").innerHTML='<option value="">Create as a new issue</option>'+s.map(i=>`<option value="${i.id}">Link as duplicate of ${i.id} · ${esc(i.title)}</option>`).join("")}
function saveIssue(){
 const t=$("#rt").value.trim(),a=$("#ra2").value.trim();if(!t||!a){$("#merr").textContent="Title and actual behaviour are required.";return}
 const call=$("#rc").value,sv=$("#rv2").value,miss=[];if(!call)miss.push("Call ID");if(!sv)miss.push("Severity");
 const id="F"+String(Math.max(...ISSUES.map(i=>+i.id.slice(1)))+1).padStart(2,"0"),cat=$("#rg").value,parent=$("#rd").value;
 const i=mk(id,"New",S.actor,call,t,sv,"—",miss.length?"Needs information":"Open",cat,[[S.actor,"Reported. Evidence lines: "+($("#rl").value||"none")+". Expected: "+($("#rx").value||"not stated")+". Actual: "+a]],[],miss);
 i.compliance=cat==="Disclosure / Compliance";if(parent){i.dupOf=parent;log(byId(parent),S.actor,id+" linked under this issue.")}
 ISSUES.unshift(i);S.sel=[];closeModal();toast(id+" saved"+(miss.length?" as Needs information":""));S.issueId=id;S.view="S04";render()}

function modal(t,b,f){$("#mt").textContent=t;$("#mbody").innerHTML=b;$("#mfoot").innerHTML=f;$("#mbg").classList.add("show")}
function closeModal(){$("#mbg").classList.remove("show")}
$("#mbg").onclick=e=>{if(e.target.id==="mbg")closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.classList.contains("off")&&b.dataset.act!=="reviewed"&&b.dataset.act!=="close")return;const f=A[b.dataset.act];if(f)f(b.dataset.arg)});
render();
